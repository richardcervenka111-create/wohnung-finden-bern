  function restore(){ var v=null; try{ v=localStorage.getItem(KEY); }catch(x){} if(!v) return; var b=document.querySelector('.lang button[data-l="'+v+'"]'); if(b&&b.getAttribute('aria-pressed')!=='true') b.click(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',restore); else restore(); })();
/* sticky header shadow */
var top=document.querySelector('.k-top.sticky'); if(top){ var on=false; window.addEventListener('scroll',function(){ var s=window.scrollY>8; if(s!==on){ on=s; top.classList.toggle('scrolled',s); } },{passive:true}); }
})();
</script>
<script>
(function(){
const V="25. 9. 2026"; const V_EN="25 Sep 2026";
const L={
 de:{desc:"Wohnungssuche in Bern bei 0,44 % Leerstand: wo suchen, was ins Dossier, welche Rechte (Formularpflicht seit 1.12.2025, Anfangsmietzins innert 30 Tagen anfechten). Kein Tracking.",logo:"Wohnung finden in Bern Logo",h:"Wohnung finden in Bern",s:"Der Wohnungsmarkt ist laut Bevölkerungsbefragung 2023 das grösste Problem der Stadt. Diese Seite sagt, wo man sucht, was ins Dossier gehört und welche Rechte seit 2025 neu sind. Geprüft am "+V+".",
  k:[["0,44 %","Leerstand Stadt Bern (Quelle: SRF zur Miet-Initiative)"],["1. 12. 2025","Formularpflicht im ganzen Kanton in Kraft"],["30 Tage","Frist, den Anfangsmietzins anzufechten"]],
  secs:[
   ["Wo suchen (nicht nur die grossen Portale)",`<ul><li><b>Genossenschaften:</b> günstiger, aber Wartelisten. Früh eintragen, mehrere gleichzeitig. Dachverband: <a href="https://www.wbg-bern.ch" rel="noopener">Wohnbaugenossenschaften Bern-Solothurn</a>.</li><li><b>Städtische Wohnungen:</b> die Stadt vermietet eigene Liegenschaften über den Fonds für Boden- und Wohnbaupolitik, Ausschreibungen auf bern.ch.</li><li><b>Portale:</b> Homegate, ImmoScout24, Flatfox (dort schreiben viele Verwaltungen direkt aus), Comparis-Suche über alle Portale.</li><li><b>Untermiete und WG:</b> WGZimmer, Flatfox, Aushänge Uni und Hochschulen, Facebook-Gruppen.</li><li><b>Quartier:</b> Aushänge in Quartierläden, Nachfragen beim Hauswart. In Bern werden viele Wohnungen weitergegeben, bevor sie online gehen.</li></ul>`,"Praxis, keine Behördenquelle. Portale und Adressen selbst prüfen."],
   ["Das Dossier: was in 10 Minuten bereit sein muss",`<ul><li>Ausgefülltes Bewerbungsformular der Verwaltung (meist online).</li><li>Betreibungsregisterauszug, nicht älter als 3 Monate (online beim Betreibungsamt Bern-Mittelland bestellbar, kostenpflichtig).</li><li>Kopie Ausweis oder Aufenthaltsbewilligung.</li><li>Lohnausweis oder Arbeitsvertrag, bei Selbständigen Steuerveranlagung.</li><li>Referenz der aktuellen Verwaltung, wenn vorhanden.</li><li>Kurzer, ehrlicher Begleittext: wer ihr seid, warum diese Wohnung, seit wann in Bern.</li></ul><p>Faustregel der Verwaltungen: Miete höchstens ein Drittel des Nettoeinkommens.</p>`,"Praxis der Verwaltungen; Betreibungsauszug: Betreibungsamt Bern-Mittelland."],
   ["Neu seit 1. 12. 2025: Formularpflicht",`<p>Der Kanton Bern hat die Formularpflicht per 1. Dezember 2025 für den ganzen Kanton in Kraft gesetzt (nach der angenommenen Miet-Initiative). Bei jeder Neuvermietung muss die Vermieterin auf dem amtlichen Formular den <b>bisherigen Mietzins</b>, die bisherigen und neuen Nebenkosten und die <b>Begründung einer Erhöhung</b> offenlegen. Die Pflicht gilt, solange der Leerstand 1,5 % oder tiefer ist; Bern liegt weit darunter.</p><p>Fehlt das Formular, ist die Mietzinsfestsetzung anfechtbar.</p>`,`Quellen: <a href="https://www.zsg.justice.be.ch/de/start/themen/zivilrecht/mietrecht/mietzins-nebenkosten.html" rel="noopener">Kanton Bern, Zivilstandes- und Schlichtungswesen › Mietzins</a>, <a href="https://www.mieterverband.ch/news/faq-formular-mitteilung-anfangsmietzins/" rel="noopener">Mieterverband FAQ</a>, <a href="https://www.hev-bern.ch/news/detail/News/formularpflicht-wird-sofort-eingefuehrt" rel="noopener">HEV Bern</a>. Geprüft ${V}.`],
   ["Anfangsmietzins anfechten: 30 Tage",`<p>Wer den neuen Mietzins für zu hoch hält, kann ihn <b>innert 30 Tagen nach Übernahme der Wohnung</b> bei der Schlichtungsbehörde anfechten und eine Herabsetzung verlangen. Das Verfahren bei der Schlichtungsbehörde ist kostenlos. Die Frist ist strikt: der Tag der Schlüsselübergabe zählt, nicht der Vertragsunterzeichnung.</p><p>Erster Schritt: sich vom Mieterinnen- und Mieterverband Kanton Bern beraten lassen (Mitgliedschaft nötig, aber günstig im Vergleich zum Streitwert).</p>`,`Quellen: <a href="https://www.mieterverband.ch/news/faq-formular-mitteilung-anfangsmietzins/" rel="noopener">Mieterverband</a>, <a href="https://www.zsg.justice.be.ch/de/start/themen/zivilrecht/mietrecht/mietzins-nebenkosten.html" rel="noopener">Kanton Bern</a>. Geprüft ${V}.`],
   ["Beim Einzug: Protokoll und Depot",`<ul><li><b>Übergabeprotokoll</b> gemeinsam ausfüllen, jeden Kratzer notieren, fotografieren mit Datum. Was nicht drinsteht, zahlt ihr beim Auszug.</li><li>Mängel, die erst später auffallen: innert 10 Tagen schriftlich nachmelden (übliche Praxis, im Mietvertrag prüfen).</li><li><b>Depot</b> maximal 3 Monatsmieten, auf ein Sperrkonto auf euren Namen, nicht aufs Konto der Verwaltung.</li></ul>`,"Praxis nach OR Art. 257e (Depot) und üblichen Mietverträgen. Bei Streit: Mieterverband."],
   ["Wenn es eng wird",`<ul><li><b>Wohnungsnot, Kündigung, Notlage:</b> Sozialdienst der Stadt Bern berät auch bei Wohnfragen; Notunterkunft über die Sozialdienste.</li><li><b>Kündigung anfechten:</b> 30 Tage ab Erhalt, bei der Schlichtungsbehörde; Erstreckung möglich.</li><li><b>Diskriminierung bei der Vergabe</b> (Name, Herkunft, Familie) ist nicht erlaubt; Fachstelle für Migrations- und Rassismusfragen der Stadt berät.</li></ul>`,"Stadt Bern, Sozialdienste; Mieterverband; Fachstelle Migration. Geprüft "+V+"."],
  ],
  foot:'Informationsseite, keine Rechtsberatung. Bei konkreten Fragen: Mieterinnen- und Mieterverband Kanton Bern oder die Schlichtungsbehörde. Zahlen und Fristen wurden am '+V+' gegen die verlinkten Quellen geprüft. Kein Tracking. <a href="https://github.com/richardcervenka111-create/wohnung-finden-bern">GitHub</a> · MIT'},
 en:{desc:"Flat hunting in Bern at 0.44 % vacancy: where to look, what goes in the file, your rights (form requirement since 1 Dec 2025, challenge the initial rent within 30 days). No tracking.",logo:"Finding a flat in Bern logo",h:"Finding a flat in Bern",s:"The housing market is the city’s biggest problem according to the 2023 population survey. This page says where to look, what goes into the application file and which rights are new since 2025. Checked on "+V_EN+".",
  k:[["0.44 %","vacancy rate City of Bern (source: SRF on the rent initiative)"],["1 Dec 2025","form requirement in force canton-wide"],["30 days","deadline to challenge the initial rent"]],
  secs:[
   ["Where to look (not only the big portals)",`<ul><li><b>Cooperatives:</b> cheaper, but waiting lists. Register early, with several at once. Umbrella organisation: <a href="https://www.wbg-bern.ch" rel="noopener">Wohnbaugenossenschaften Bern-Solothurn</a>.</li><li><b>City-owned flats:</b> the city lets its own buildings via the Fonds für Boden- und Wohnbaupolitik, listings on bern.ch.</li><li><b>Portals:</b> Homegate, ImmoScout24, Flatfox (many agencies list there directly), Comparis meta-search.</li><li><b>Sublets and shared flats:</b> WGZimmer, Flatfox, notice boards at the university, Facebook groups.</li><li><b>The neighbourhood:</b> notices in local shops, ask the caretaker. In Bern many flats are passed on before they go online.</li></ul>`,"Practice, not an official source. Check portals and addresses yourself."],
   ["The file: ready in 10 minutes",`<ul><li>The agency’s application form (usually online).</li><li>Debt enforcement register extract, not older than 3 months (order online from Betreibungsamt Bern-Mittelland, fee applies).</li><li>Copy of ID or residence permit.</li><li>Salary statement or employment contract; self-employed: tax assessment.</li><li>Reference from your current agency if you have one.</li><li>Short, honest cover text: who you are, why this flat, how long you have been in Bern.</li></ul><p>Agencies’ rule of thumb: rent at most one third of net income.</p>`,"Agency practice; register extract: Betreibungsamt Bern-Mittelland."],
   ["New since 1 Dec 2025: the form requirement",`<p>The Canton of Bern put the form requirement into force on 1 December 2025 for the whole canton (after the accepted rent initiative). On every new letting the landlord must disclose on the official form the <b>previous rent</b>, previous and new ancillary costs and the <b>reason for any increase</b>. The duty applies as long as vacancy is 1.5 % or lower; Bern is far below.</p><p>If the form is missing, the rent setting can be challenged.</p>`,`Sources: <a href="https://www.zsg.justice.be.ch/de/start/themen/zivilrecht/mietrecht/mietzins-nebenkosten.html" rel="noopener">Canton of Bern › Rent (Mietzins)</a>, <a href="https://www.mieterverband.ch/news/faq-formular-mitteilung-anfangsmietzins/" rel="noopener">Tenants’ association FAQ</a>, <a href="https://www.hev-bern.ch/news/detail/News/formularpflicht-wird-sofort-eingefuehrt" rel="noopener">HEV Bern</a>. Checked ${V_EN}.`],
   ["Challenging the initial rent: 30 days",`<p>If you consider the new rent excessive, you can challenge it <b>within 30 days of taking over the flat</b> at the conciliation authority and demand a reduction. The conciliation procedure is free of charge. The deadline is strict: the day of the key handover counts, not the signing date.</p><p>First step: advice from the Canton of Bern tenants’ association (membership required, but cheap compared with what is at stake).</p>`,`Sources: <a href="https://www.mieterverband.ch/news/faq-formular-mitteilung-anfangsmietzins/" rel="noopener">Mieterverband</a>, <a href="https://www.zsg.justice.be.ch/de/start/themen/zivilrecht/mietrecht/mietzins-nebenkosten.html" rel="noopener">Canton of Bern</a>. Checked ${V_EN}.`],
   ["Moving in: handover report and deposit",`<ul><li><b>Handover report</b> filled in together, every scratch noted, photographed with date. What is not in it, you pay for when you leave.</li><li>Defects noticed later: report in writing within 10 days (common practice, check your contract).</li><li><b>Deposit</b> at most 3 months’ rent, on a blocked account in your name, not on the agency’s account.</li></ul>`,"Practice under Swiss Code of Obligations Art. 257e (deposit) and usual contracts. Disputes: tenants’ association."],
   ["When things get difficult",`<ul><li><b>Housing emergency, termination, hardship:</b> the city’s social services also advise on housing; emergency accommodation via social services.</li><li><b>Challenging a termination:</b> 30 days from receipt, at the conciliation authority; extension possible.</li><li><b>Discrimination in letting</b> (name, origin, family) is not allowed; the city’s office for migration and racism issues advises.</li></ul>`,"City of Bern social services; tenants’ association; migration office. Checked "+V_EN+"."],
  ],
  foot:'Information page, not legal advice. For concrete questions: Canton of Bern tenants’ association or the conciliation authority. Figures and deadlines checked on '+V_EN+' against the linked sources. No tracking. <a href="https://github.com/richardcervenka111-create/wohnung-finden-bern">GitHub</a> · MIT'},
 sk:{h:"Hľadanie bytu v Berne",s:"Trh s bývaním je podľa prieskumu obyvateľov 2023 najväčší problém mesta. Táto stránka hovorí, kde hľadať, čo patrí do žiadosti a ktoré práva sú od 2025 nové. Overené "+V+".",
  k:[["0,44 %","neobsadenosť bytov v meste Bern (zdroj: SRF k nájomnej iniciatíve)"],["1. 12. 2025","formulárová povinnosť platí v celom kantóne"],["30 dní","lehota na napadnutie počiatočného nájomného"]],
  secs:[
   ["Kde hľadať (nie len veľké portály)",`<ul><li><b>Družstvá:</b> lacnejšie, ale čakacie listiny. Zapísať sa skoro, do viacerých naraz. Zväz: <a href="https://www.wbg-bern.ch" rel="noopener">Wohnbaugenossenschaften Bern-Solothurn</a>.</li><li><b>Mestské byty:</b> mesto prenajíma vlastné domy cez Fonds für Boden- und Wohnbaupolitik, ponuky na bern.ch.</li><li><b>Portály:</b> Homegate, ImmoScout24, Flatfox (mnohé správy tam inzerujú priamo), Comparis ako vyhľadávač nad všetkými.</li><li><b>Podnájom a spolubývanie:</b> WGZimmer, Flatfox, nástenky na univerzite, facebookové skupiny.</li><li><b>Štvrť:</b> oznamy v obchodoch, spýtať sa domovníka. V Berne sa veľa bytov posunie ďalej skôr, než sa dostanú online.</li></ul>`,"Prax, nie úradný zdroj. Portály a adresy si over sám."],
   ["Žiadosť: čo musí byť hotové za 10 minút",`<ul><li>Vyplnený formulár správy (väčšinou online).</li><li>Výpis z registra exekúcií (Betreibungsregisterauszug), nie starší než 3 mesiace (online na Betreibungsamt Bern-Mittelland, spoplatnené).</li><li>Kópia dokladu alebo povolenia na pobyt.</li><li>Výplatná páska alebo pracovná zmluva; SZČO: daňový výmer.</li><li>Referencia súčasnej správy, ak je.</li><li>Krátky, úprimný sprievodný text: kto ste, prečo tento byt, odkedy v Berne.</li></ul><p>Pravidlo správ: nájom najviac tretina čistého príjmu.</p>`,"Prax správ; výpis: Betreibungsamt Bern-Mittelland."],
   ["Nové od 1. 12. 2025: formulárová povinnosť",`<p>Kantón Bern zaviedol formulárovú povinnosť od 1. decembra 2025 pre celý kantón (po prijatej nájomnej iniciatíve). Pri každom novom prenájme musí prenajímateľ na úradnom formulári zverejniť <b>doterajšie nájomné</b>, doterajšie a nové vedľajšie náklady a <b>odôvodnenie zvýšenia</b>. Povinnosť platí, kým je neobsadenosť 1,5 % alebo nižšia; Bern je hlboko pod tým.</p><p>Ak formulár chýba, určenie nájomného sa dá napadnúť.</p>`,`Zdroje: <a href="https://www.zsg.justice.be.ch/de/start/themen/zivilrecht/mietrecht/mietzins-nebenkosten.html" rel="noopener">Kantón Bern › Mietzins</a>, <a href="https://www.mieterverband.ch/news/faq-formular-mitteilung-anfangsmietzins/" rel="noopener">Mieterverband FAQ</a>, <a href="https://www.hev-bern.ch/news/detail/News/formularpflicht-wird-sofort-eingefuehrt" rel="noopener">HEV Bern</a>. Overené ${V}.`],
   ["Napadnúť počiatočné nájomné: 30 dní",`<p>Kto považuje nové nájomné za privysoké, môže ho <b>do 30 dní od prevzatia bytu</b> napadnúť na zmierovacom orgáne a žiadať zníženie. Konanie na zmierovacom orgáne je bezplatné. Lehota je prísna: počíta sa deň odovzdania kľúčov, nie podpisu zmluvy.</p><p>Prvý krok: poradenstvo Mieterinnen- und Mieterverband Kanton Bern (treba členstvo, ale lacné oproti tomu, o čo ide).</p>`,`Zdroje: <a href="https://www.mieterverband.ch/news/faq-formular-mitteilung-anfangsmietzins/" rel="noopener">Mieterverband</a>, <a href="https://www.zsg.justice.be.ch/de/start/themen/zivilrecht/mietrecht/mietzins-nebenkosten.html" rel="noopener">Kantón Bern</a>. Overené ${V}.`],
   ["Pri nasťahovaní: protokol a depozit",`<ul><li><b>Odovzdávací protokol</b> vyplniť spolu, zapísať každý škrabanec, odfotiť s dátumom. Čo v ňom nie je, platíte pri odsťahovaní.</li><li>Chyby, ktoré si všimnete neskôr: nahlásiť písomne do 10 dní (bežná prax, pozri zmluvu).</li><li><b>Depozit</b> najviac 3 mesačné nájmy, na viazaný účet na vaše meno, nie na účet správy.</li></ul>`,"Prax podľa OR čl. 257e (depozit) a bežných zmlúv. Pri spore: Mieterverband."],
   ["Keď je zle",`<ul><li><b>Núdza s bývaním, výpoveď:</b> sociálna služba mesta Bern radí aj pri bývaní; núdzové ubytovanie cez sociálne služby.</li><li><b>Napadnúť výpoveď:</b> 30 dní od doručenia, na zmierovacom orgáne; predĺženie možné.</li><li><b>Diskriminácia pri prideľovaní</b> (meno, pôvod, rodina) nie je dovolená; radí Fachstelle für Migrations- und Rassismusfragen mesta.</li></ul>`,"Mesto Bern, sociálne služby; Mieterverband; Fachstelle Migration. Overené "+V+"."],
  ],
  foot:'Informačná stránka, nie právne poradenstvo. Pri konkrétnych otázkach: Mieterinnen- und Mieterverband Kanton Bern alebo zmierovací orgán. Čísla a lehoty overené '+V+' proti odkazovaným zdrojom. Žiadne sledovanie. <a href="https://github.com/richardcervenka111-create/wohnung-finden-bern">GitHub</a> · MIT'}};
let lang="de"; const $=id=>document.getElementById(id); const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){ const T=L[lang]; document.documentElement.lang=lang; document.title=T.h; const mt=document.querySelector('meta[name=description]'); if(mt&&T.desc) mt.content=T.desc; const lg=document.querySelector('svg.k-logo'); if(lg&&T.logo) lg.setAttribute("aria-label",T.logo); $("h").textContent=T.h; $("s").textContent=T.s; $("foot").innerHTML=T.foot;
  $("k").innerHTML=T.k.map(x=>`<div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join("");
  $("secs").innerHTML=T.secs.map((s,i)=>`<details${i===0?" open":""}><summary>${esc(s[0])}</summary><div class="b">${s[1]}<div class="src">${s[2]}</div></div></details>`).join("");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang?"true":"false")); K.stagger($("k"));K.stagger($("secs")); }
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l; render();}));
render();
})();
</script>
